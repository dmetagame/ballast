name: Production Watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      exercise_alert:
        description: Exercise the failure and issue-creation path
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: watchdog
        continue-on-error: true
        env:
          EXERCISE_ALERT: ${{ inputs.exercise_alert }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          (
            set -euo pipefail
            previous_commit=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
              https://ballast.rouma.online/ops/health.json | jq -er '.releaseCommit')
            previous_commit=${previous_commit,,}
            [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${previous_commit}^{commit}"
            git merge-base --is-ancestor "$previous_commit" "$GITHUB_SHA" || {
              echo "deployed release is not an ancestor of main: $previous_commit" >&2
              exit 1
            }
            rollout_started_at=""
            for attempt in 1 2 3; do
              if rollout_started_at=$(gh api -X GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs" \
                -f head_sha="$GITHUB_SHA" -f event=push -f per_page=1 \
                --jq '.workflow_runs[0].created_at // empty'); then
                break
              fi
              sleep "$attempt"
            done
            if [[ -z "$rollout_started_at" ]]; then
              rollout_started_at=$(git show -s --format=%cI HEAD)
            fi
            rollout_epoch=$(date -d "$rollout_started_at" +%s)
            export EXPECTED_RELEASE_COMMIT="$GITHUB_SHA"
            export PREVIOUS_RELEASE_COMMIT="$previous_commit"
            export RELEASE_ROLLOUT_DEADLINE_MS=$(( (rollout_epoch + 20 * 60) * 1000 ))
            if [[ "${EXERCISE_ALERT:-false}" = true ]]; then
              export HEALTH_URL="https://ballast.rouma.online/ops/watchdog-alert-drill.json"
            fi
            node monitor/watchdog.mjs
          ) 2>&1 | tee /tmp/ballast-watchdog.log
      - uses: actions/github-script@v9
        if: always() && steps.watchdog.outcome == 'failure'
        env:
          WATCHDOG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ballast-production-watchdog -->';
            const output = fs.readFileSync('/tmp/ballast-watchdog.log', 'utf8').trim().slice(-6000);
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'production-alert' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'production-alert', color: 'b42318', description: 'Automated production health incident' });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.body?.includes(marker));
            const body = `${marker}\nThe independent production watchdog failed at ${new Date().toISOString()}.\n\nRun: ${process.env.WATCHDOG_RUN_URL}\n\n\`\`\`\n${output}\n\`\`\``;
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Production watchdog failure', body, labels: ['production-alert'] });
            }
      - uses: actions/github-script@v9
        if: always() && steps.watchdog.outcome == 'success'
        with:
          script: |
            const marker = '<!-- ballast-production-watchdog -->';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert',
              per_page: 100,
            });
            for (const issue of issues.filter((item) => item.body?.includes(marker))) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Production recovered at ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
      - if: always() && steps.watchdog.outcome == 'failure'
        run: exit 1
