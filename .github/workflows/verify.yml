name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            landing/package-lock.json
            monitor/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache-dependency-path: fce/go.sum
      - run: for file in scripts/*.sh; do bash -n "$file"; done
      - run: node --check monitor/verify-controlled-receipt.mjs
      - run: node --check monitor/healthcheck.mjs
      - run: systemd-analyze --user verify deploy/systemd/ballast-keeper.service deploy/systemd/ballast-keeper-health.service deploy/systemd/ballast-keeper-health.timer
      - run: forge test --no-match-path 'test/*.fork.t.sol'
      - run: npm ci
        working-directory: app
      - run: npm run check && VITE_ENABLE_ENROLLMENT_WRITES=true npm run build && npm run verify:production
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run verify
        working-directory: app
      - run: npm ci
        working-directory: landing
      - run: node data.mjs && git diff --exit-code -- src/figures.json && npm run build && npm run verify
        working-directory: landing
      - run: npm ci
        working-directory: monitor
      - run: npm test
        working-directory: monitor
      - run: node -e 'const s=require("./data/snapshot.json"); if(!s.blockHash || !s.prices?.FXRP?.usd) process.exit(1)'
        working-directory: monitor
      - run: go test ./...
        working-directory: fce
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: fce
      - run: npm run build && npm run verify && git diff --exit-code -- index.html
        working-directory: dashboard

  production-fork:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: ./scripts/verify-production-fork.sh
      - run: ./scripts/verify-controlled-production-fork.sh
