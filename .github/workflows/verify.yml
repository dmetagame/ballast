name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            landing/package-lock.json
            monitor/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: fce/go.sum
      - run: forge test --no-match-path 'test/*.fork.t.sol'
      - run: npm ci
        working-directory: app
      - run: npm run check && VITE_ENABLE_ENROLLMENT_WRITES=true npm run build && npm run verify:production
        working-directory: app
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
      - run: npm ci
        working-directory: monitor
      - run: npm test
        working-directory: monitor
      - run: go test ./...
        working-directory: fce
      - run: npm run build && npm run verify && git diff --exit-code -- index.html
        working-directory: dashboard

  production-fork:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: ./scripts/verify-production-fork.sh
