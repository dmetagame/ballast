services:
  redis:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ext-proxy:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6664/info"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      redis:
        condition: service_healthy

  extension-tee:
    restart: unless-stopped
    depends_on:
      ext-proxy:
        condition: service_healthy
