[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/", "morpho-blue/=lib/morpho-blue/src/"]
# No solc pin: Morpho Blue requires exactly 0.8.19 while Ballast targets ^0.8.26, so forge
# picks a compatible compiler per file. The mainnet contracts were verified under 0.8.26 and
# are immutable on-chain, so this affects future builds only.
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
flare = "https://flare-api.flare.network/ext/C/rpc"
coston2 = "https://coston2-api.flare.network/ext/C/rpc"

# Source verification on Flare's Blockscout instance. Blockscout needs no API key,
# but forge requires the field to be present, so it is a placeholder.
[etherscan]
flare = { key = "blockscout", url = "https://flare-explorer.flare.network/api", chain = 14 }
